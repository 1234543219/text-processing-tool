<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>文本处理工具</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        input[type="text"] {
            width: 300px;
            height: 30px;
            margin: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100px;
            height: 40px;
            margin: 10px;
            padding: 5px 10px;
            font-size: 16px;
            color: white;
            background-color: #008CBA;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #005f73;
        }

        button:active {
            background-color: #003d4a;
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <input type="text" id="input1">
    <input type="text" id="input2">
    <input type="text" id="input3" placeholder="以这个内容分割字符串">
    <button>逆序</button>
    <button>相等</button>
    <button>包含</button>
    <button>分割</button>

    <footer>
        &copy; 2025 文本处理工具. 天若有情673&copy;版权所有.
    </footer>

    <script>
        var input1 = document.getElementById('input1');
        var input2 = document.getElementById('input2');
        var btn1 = document.getElementsByTagName('button')[0];
        var btn2 = document.getElementsByTagName('button')[1];
        var btn3 = document.getElementsByTagName('button')[2];
        btn1.onclick = function() {
            var str = input1.value;
            var arr = str.split('');
            arr.reverse();
            var newStr = arr.join('');
            input2.value = newStr;
        }
        btn2.onclick = function() {
            var str1 = input1.value;
            var str2 = input2.value;
            if(str1 == str2) {
                alert('相等');
            } else {
                alert('不相等');
            }
        }
        btn3.onclick = function() {
            var str1 = input1.value;
            var str2 = input2.value;
            if(str1.indexOf(str2) != -1) {
                alert('包含');
            } else {
                alert('不包含');
            }
        }
        var btn4 = document.getElementsByTagName('button')[3];
        btn4.onclick = function() {
            var str = input1.value;
            var str2 = input3.value;
            var arr = str.split(str2);
            input2.value = arr.join(' ');
        }
    </script>
</body>
</html>
